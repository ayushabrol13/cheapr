name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  extension:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: extension}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: extension/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: {name: cheapr-extension, path: extension/dist/*.zip}
