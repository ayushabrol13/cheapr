name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: cheapr, POSTGRES_PASSWORD: cheapr, POSTGRES_DB: cheapr}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cheapr" --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q  # SQLite
      - run: python -m pytest -q  # Postgres: migrations, row locks, ON CONFLICT
        env: {DATABASE_URL: "postgresql+psycopg://cheapr:cheapr@localhost:5432/cheapr"}
  extension:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: extension}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: extension/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: {name: cheapr-extension, path: extension/dist/*.zip}
