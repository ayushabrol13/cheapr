<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheapr</title>
<link rel="stylesheet" href="welcome.css">
</head>
<body>
<main>
  <div class="lang"><select id="lang" aria-label="Language"><option value="auto">Auto</option><option value="en">English</option><option value="hi">हिन्दी</option></select></div>
  <header>
    <img src="../icons/128.png" alt="" width="56" height="56">
    <h1 data-i18n="w_title"></h1>
    <p class="lead" data-i18n="w_lead"></p>
  </header>

  <section class="how">
    <div><b data-i18n="w_step1_t"></b><span data-i18n="w_step1"></span></div>
    <div><b data-i18n="w_step2_t"></b><span data-i18n="w_step2"></span></div>
    <div><b data-i18n="w_step3_t"></b><span data-i18n="w_step3"></span></div>
  </section>

  <form id="setup">
    <h2 data-i18n="w_choices"></h2>
    <fieldset>
      <legend data-i18n="w_share_q"></legend>
      <label class="choice"><input type="radio" name="share" value="yes" required>
        <span><b data-i18n="w_share_yes_t"></b> <span data-i18n="w_rec"></span><br><small data-i18n="w_share_yes"></small></span></label>
      <label class="choice"><input type="radio" name="share" value="no">
        <span><b data-i18n="w_share_no_t"></b><br><small data-i18n="w_share_no"></small></span></label>
    </fieldset>
    <fieldset>
      <legend data-i18n="w_spend_q"></legend>
      <label class="choice"><input type="checkbox" name="spend">
        <span><b data-i18n="w_spend_t"></b><br><small data-i18n="w_spend"></small></span></label>
    </fieldset>
    <label class="field"><span data-i18n="w_email"></span>
      <input type="email" name="email" placeholder="you@example.com" autocomplete="email"></label>
    <button class="primary" data-i18n="w_start"></button>
    <p id="status" role="status"></p>
  </form>

  <section class="promise">
    <h2 data-i18n="w_never"></h2>
    <ul><li data-i18n="w_never1"></li><li data-i18n="w_never2"></li><li data-i18n="w_never3"></li></ul>
    <p class="muted"><span data-i18n="w_later"></span> <a href="https://github.com/ayushabrol13/cheapr/blob/main/PRIVACY.md" target="_blank" rel="noopener" data-i18n="w_privacy"></a></p>
  </section>
</main>
<script src="../lib/i18n.js"></script>
<script src="welcome.js"></script>
</body>
</html>
