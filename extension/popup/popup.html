<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cheapr</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><img src="../icons/32.png" alt="" width="22" height="22"><b>Cheapr</b><span id="quiet-pill" class="pill" data-i18n="p_paused" hidden></span></header>
<nav role="tablist" aria-label="Cheapr">
  <button role="tab" id="tab-page" aria-controls="page" aria-selected="true" data-tab="page" data-i18n="p_tab_page"></button>
  <button role="tab" id="tab-alerts" aria-controls="alerts" aria-selected="false" data-tab="alerts"><span data-i18n="p_tab_alerts"></span> <span id="alert-count" class="count" hidden></span></button>
  <button role="tab" id="tab-spend" aria-controls="spend" aria-selected="false" data-tab="spend" data-i18n="p_tab_spend"></button>
  <button role="tab" id="tab-settings" aria-controls="settings" aria-selected="false" data-tab="settings" data-i18n="p_tab_settings"></button>
</nav>
<main>
  <section id="page" role="tabpanel" aria-labelledby="tab-page"></section>
  <section id="alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden></section>
  <section id="spend" role="tabpanel" aria-labelledby="tab-spend" hidden></section>
  <section id="settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <form id="settings-form">
      <h3 data-i18n="s_language"></h3>
      <select name="lang" aria-label="Language">
        <option value="auto" data-i18n="s_lang_auto"></option>
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
      </select>
      <h3 data-i18n="s_price_history"></h3>
      <label class="toggle"><input name="overlay" type="checkbox"><span data-i18n="s_show_card"></span></label>
      <label class="toggle"><input name="share" type="checkbox"><span><span data-i18n="s_share"></span><small data-i18n="s_share_hint"></small></span></label>
      <h3 data-i18n="s_alerts"></h3>
      <div id="telegram" class="tg" hidden></div>
      <label class="field"><span data-i18n="s_email"></span><input name="email" type="email" placeholder="you@example.com" autocomplete="email"></label>
      <p class="muted small" id="email-status"></p>
      <h3 data-i18n="s_coupons"></h3>
      <label class="toggle"><input name="coupons" type="checkbox"><span data-i18n="s_find_coupons"></span></label>
      <label class="toggle"><input name="allSites" type="checkbox"><span><span data-i18n="s_all_sites"></span><small data-i18n="s_all_sites_hint"></small></span></label>
      <h3 data-i18n="s_spending"></h3>
      <label class="toggle"><input name="spend" type="checkbox"><span><span data-i18n="s_spend_toggle"></span><small data-i18n="s_spend_hint"></small></span></label>
      <h3 data-i18n="s_quiet"></h3>
      <label class="toggle"><input name="quiet" type="checkbox"><span data-i18n="s_pause"></span></label>
      <div id="muted"></div>
      <h3 data-i18n="s_data"></h3>
      <div class="links"><button type="button" class="btn ghost" id="export" data-i18n="s_export"></button><button type="button" class="btn danger" id="delete" data-i18n="s_delete"></button></div>
      <details><summary data-i18n="s_advanced"></summary>
        <label class="field"><span data-i18n="s_server"></span><input name="backend" type="url" required></label>
      </details>
      <p class="muted" id="settings-status" role="status"></p>
      <p class="muted small"><a href="../welcome/welcome.html" target="_blank" data-i18n="s_privacy"></a> · v<span id="version"></span></p>
    </form>
  </section>
</main>
<script src="../lib/i18n.js"></script>
<script src="../lib/format.js"></script>
<script src="popup.js"></script>
</body>
</html>
